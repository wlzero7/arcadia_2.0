<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="icon" type="image/png" href="/assets/arcadia-logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackjack Multiplayer — Arcadia</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/blackjack-mp.css">
    <link rel="stylesheet" href="css/multiplayer-arena.css">
</head>
<body>
    <header class="header">
        <nav class="navbar container">
            <a href="index.html" class="logo">🎰 Arcadia</a>
            <ul class="nav-links">
                <li><a href="index.html">Início</a></li>
                <li><a href="games.html" class="active">Jogos</a></li>
                <li><a href="rooms.html">Salas</a></li>
                <li><a href="ranking.html">Ranking</a></li>
                <li><a href="perfil.html">Perfil</a></li>
                <li><a href="sobre.html">Sobre</a></li>
            </ul>
            <div class="nav-actions">
                <button class="sfx-toggle" id="sfxToggle" title="Sons">🔊</button>
                <div class="home-wallet"><strong id="walletBalance">—</strong></div>
            </div>
        </nav>
    </header>

    <main class="container bjmp-main">
        <h1>🃏 <span class="accent">Blackjack Multiplayer</span></h1>
        <p class="muted">Mesa cooperativa de Blackjack.</p>

        <div class="bjmp-lobby" id="bjmpLobby">
            <button class="btn btn-primary" id="createTableBtn">🃏 Criar mesa</button>
            <div class="bjmp-join">
                <input type="text" id="joinCode" placeholder="CÓDIGO" maxlength="6">
                <button class="btn btn-outline" id="joinTableBtn">Entrar</button>
            </div>
        </div>

        <section class="bjmp-arena multiplayer-arena hidden" id="bjmpArena">
            <div class="bjmp-header">
                <span>Mesa: <strong class="accent" id="tableCode">—</strong></span>
                <span class="muted">Limite: <strong id="tableLimit">21</strong></span>
                <span>Pote: <strong id="bjPot">0 AC</strong></span>
                <button class="btn btn-primary hidden" id="startBtn">▶ Iniciar rodada</button>
            </div>

            <div class="bjmp-players" id="playersRow"></div>
            <div id="bjRoundResult" class="bj-round-result" role="status"></div>
            <div class="bjmp-bets" id="bjBetRow">
                <label>Aposta Coop<input id="bjWager" type="number" value="100" min="10" step="1"></label>
                <button class="btn btn-primary" id="bjBetBtn">Confirmar aposta</button>
                <button class="btn btn-outline" id="bjPracticeBtn">Sem aposta</button>
                <span id="bjBetStatus" role="status"></span>
            </div>

            <div class="bjmp-actions hidden" id="actionsRow">
                <button class="btn btn-primary" id="hitBtn">Comprar (Hit)</button>
                <button class="btn btn-outline" id="standBtn">Parar (Stand)</button>
                <button class="btn btn-outline" id="doubleBtn">Dobrar</button>
                <button class="btn btn-outline" id="specialsBtn">🎴 Cartas (<span id="specialsCount">0</span>)</button>
                <span class="nrg-badge">⚡ NRG: <strong id="nrgValue">0</strong></span>
            </div>

            <div class="specials-panel hidden" id="specialsPanel">
                <h3>🎴 Suas cartas especiais</h3>
                <div id="specialsList"></div>
                <div class="special-target hidden" id="specialTarget">
                    <label>Alvo: <select id="targetSelect"></select></label>
                    <label id="pickCardControls" class="hidden">Carta:
                        <select id="pickRank" aria-label="Valor da carta">
                            <option>A</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option>J</option><option>Q</option><option>K</option>
                        </select>
                        <select id="pickSuit" aria-label="Naipe da carta">
                            <option>♠</option><option>♥</option><option>♦</option><option>♣</option>
                        </select>
                    </label>
                </div>
            </div>

            <div class="bjmp-log" id="bjLog"></div>
        </section>
    </main>

    <script src="js/sfx.js"></script>
    <script src="js/api.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="js/wallet.js"></script>
    <script src="js/battle-presentation.js"></script>
    <script src="js/blackjack-mp.js"></script>
</body>
</html>
