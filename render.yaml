services:
  # Arcadia — frontend + API + WebSocket em UM serviço (Express serve tudo)
  - type: web
    name: arcadia
    runtime: node
    plan: free
    region: oregon
    buildCommand: cd server && npm ci
    startCommand: cd server && node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: REQUIRE_PERSISTENT_DB
        value: "1"
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
    # Configure private Turso variables before production deployment.
    # Missing remote configuration must not create an empty local database.
